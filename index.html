<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社会联结与应激回访表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf1f4;
      --bg-2: #e5ebef;
      --panel: rgba(251, 252, 253, 0.94);
      --panel-line: rgba(98, 113, 128, 0.18);
      --panel-line-strong: rgba(98, 113, 128, 0.34);
      --text: #1d2530;
      --muted: rgba(29, 37, 48, 0.62);
      --soft: rgba(29, 37, 48, 0.38);
      --accent: #516476;
      --accent-2: #7b91a6;
      --danger: #8d323c;
      --danger-soft: rgba(141, 50, 60, 0.12);
      --shadow: 0 28px 68px rgba(61, 79, 96, 0.12);
      --radius: 8px;
      --transition: 220ms ease;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background:
        radial-gradient(circle at 12% 12%, rgba(173, 191, 206, 0.18), transparent 28%),
        radial-gradient(circle at 86% 10%, rgba(160, 178, 196, 0.18), transparent 24%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      transition: background 900ms ease, color 600ms ease;
    }

    body {
      overflow: hidden;
      overflow-x: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.15), transparent 18%),
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 3px
        );
      mix-blend-mode: soft-light;
      opacity: 0.55;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(760px, calc(100vw - 34px));
      min-height: min(790px, calc(100vh - 44px));
      display: flex;
      flex-direction: column;
      border: 1px solid var(--panel-line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
      transition: border-color 500ms ease, background 500ms ease, box-shadow 500ms ease, transform 500ms ease;
    }

    .shell.quiet-glitch {
      animation: quietGlitch 420ms steps(2, end);
    }

    .shell.page-shake-soft {
      animation: pageShakeSoft 520ms steps(2, end);
    }

    .shell.page-shake-hard {
      animation: pageShakeHard 760ms steps(2, end);
    }

    @keyframes quietGlitch {
      0%, 100% { transform: translate(0, 0); filter: none; }
      30% { transform: translate(1px, -1px); filter: blur(0.12px); }
      58% { transform: translate(-1px, 0); filter: none; }
    }

    @keyframes pageShakeSoft {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      18% { transform: translate(-2px, 1px) rotate(-0.08deg); }
      36% { transform: translate(2px, -1px) rotate(0.08deg); }
      54% { transform: translate(-1px, -1px) rotate(-0.04deg); }
      72% { transform: translate(1px, 1px) rotate(0.04deg); }
    }

    @keyframes pageShakeHard {
      0%, 100% { transform: translate(0, 0) rotate(0); filter: none; }
      10% { transform: translate(-4px, 2px) rotate(-0.16deg); filter: blur(0.2px); }
      22% { transform: translate(5px, -2px) rotate(0.14deg); }
      34% { transform: translate(-3px, -2px) rotate(-0.12deg); }
      48% { transform: translate(4px, 2px) rotate(0.1deg); filter: none; }
      62% { transform: translate(-2px, 1px) rotate(-0.08deg); }
      78% { transform: translate(2px, 0) rotate(0.06deg); }
    }

    .shell-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--panel-line);
      background: rgba(255, 255, 255, 0.32);
      transition: border-color 500ms ease, background 500ms ease;
    }

    .meta {
      display: grid;
      gap: 5px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .meta-code {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .meta-title {
      font-size: 16px;
      line-height: 1.45;
      color: var(--text);
    }

    .meta-sub {
      font-size: 12px;
      line-height: 1.7;
      color: var(--muted);
    }

    .audio-toggle,
    .primary-button,
    .submit-button,
    .restart-button {
      cursor: pointer;
      border: 1px solid var(--panel-line-strong);
      background: rgba(255, 255, 255, 0.64);
      color: var(--text);
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition), opacity var(--transition);
    }

    .audio-toggle {
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .audio-toggle:hover,
    .primary-button:hover,
    .submit-button:hover,
    .restart-button:hover {
      background: rgba(255, 255, 255, 0.86);
      border-color: rgba(74, 89, 107, 0.42);
    }

    .audio-toggle:disabled {
      cursor: default;
      opacity: 0.58;
    }

    .view {
      display: none;
      flex: 1 1 auto;
      min-height: 0;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    .intro {
      justify-content: center;
      padding: 38px 34px 34px;
    }

    .intro-inner {
      width: min(560px, 100%);
    }

    .eyebrow {
      margin: 0 0 14px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--soft);
    }

    .intro h1 {
      margin: 0;
      font-family: "STSong", "SimSun", serif;
      font-weight: 400;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.18;
      letter-spacing: 0.02em;
    }

    .intro-copy {
      margin: 16px 0 0;
      font-size: 15px;
      line-height: 1.9;
      color: var(--muted);
    }

    .intro-copy + .intro-copy {
      margin-top: 10px;
    }

    .intro-note {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(98, 113, 128, 0.14);
      background: rgba(255, 255, 255, 0.56);
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
    }

    .intro-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }

    .primary-button {
      min-width: 136px;
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 14px;
    }

    .secondary-note {
      font-size: 12px;
      color: var(--soft);
    }

    .survey {
      gap: 18px;
      padding: 22px;
    }

    .progress {
      display: grid;
      gap: 10px;
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--soft);
      letter-spacing: 0.04em;
    }

    .progress-track {
      position: relative;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(98, 113, 128, 0.12);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(104, 131, 154, 0.86), rgba(153, 176, 197, 0.96));
      transition: width 340ms ease, background 420ms ease;
    }

    @keyframes progressPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .progress-fill.pulse {
      animation: progressPulse 280ms ease;
    }

    .helper-line {
      min-height: 18px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: rgba(29, 37, 48, 0.44);
      transition: color 260ms ease;
    }

    .card {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px 24px 22px;
      border: 1px solid rgba(98, 113, 128, 0.14);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      transition: background 420ms ease, border-color 420ms ease, box-shadow 420ms ease;
      overflow-y: auto;
    }

    .number-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .question-title {
      margin: 0;
      font-family: "STSong", "SimSun", serif;
      font-weight: 400;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.32;
      letter-spacing: 0.02em;
    }

    .question-copy {
      margin: -2px 0 0;
      font-size: 15px;
      line-height: 1.92;
      color: var(--muted);
      white-space: pre-line;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      padding: 14px 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border-radius: 6px;
      border: 1px solid rgba(98, 113, 128, 0.14);
      background: rgba(255, 255, 255, 0.64);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color var(--transition), background var(--transition), transform var(--transition), opacity var(--transition), filter var(--transition);
      position: relative;
      overflow: hidden;
    }

    .option:hover {
      border-color: rgba(81, 100, 118, 0.3);
      background: rgba(255, 255, 255, 0.86);
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: rgba(81, 100, 118, 0.4);
      background: rgba(236, 242, 247, 0.92);
    }

    .option:disabled {
      cursor: default;
      opacity: 0.84;
      transform: none;
    }

    .option-dot {
      width: 14px;
      height: 14px;
      margin-top: 4px;
      border-radius: 50%;
      border: 1px solid rgba(98, 113, 128, 0.36);
      flex: 0 0 auto;
      transition: border-color var(--transition), background var(--transition);
    }

    .option.selected .option-dot {
      border-color: var(--accent);
      background: var(--accent);
    }

    .option-body {
      display: grid;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .option-text {
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: 0.01em;
      transition: opacity 100ms ease, filter 100ms ease;
    }

    .option-text.replacing {
      opacity: 0;
      filter: blur(2px);
    }

    .option.faded {
      opacity: 0.42;
      filter: saturate(0.64);
    }

    .option.locked {
      opacity: 0.28;
      border-style: dashed;
      cursor: not-allowed;
    }

    .text-block {
      display: none;
      gap: 12px;
    }

    .text-block.active {
      display: grid;
    }

    .dialogue-log {
      display: none;
      gap: 8px;
      max-height: 168px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid rgba(98, 113, 128, 0.14);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.58);
    }

    .dialogue-log.active {
      display: grid;
    }

    .dialogue-line {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      white-space: pre-line;
    }

    .dialogue-line.self {
      color: var(--text);
    }

    .dialogue-line.other {
      color: rgba(141, 50, 60, 0.92);
    }

    .text-input {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      padding: 14px 15px;
      border: 1px solid rgba(98, 113, 128, 0.16);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.74);
      color: var(--text);
      line-height: 1.85;
      outline: none;
      transition: border-color var(--transition), background var(--transition), transform 90ms linear, box-shadow var(--transition);
    }

    .text-input:focus {
      border-color: rgba(81, 100, 118, 0.34);
      box-shadow: 0 0 0 1px rgba(81, 100, 118, 0.06);
    }

    .input-row {
      display: flex;
      justify-content: flex-end;
    }

    .submit-button {
      min-width: 98px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
    }

    .input-hint {
      margin: -2px 0 0;
      min-height: 18px;
      font-size: 12px;
      color: var(--soft);
    }

    .feedback {
      min-height: 26px;
      font-size: 13px;
      line-height: 1.8;
      color: rgba(141, 50, 60, 0.78);
      white-space: pre-line;
    }

    .step17-reply {
      margin: 24px 0 0;
      font-family: "STSong", "SimSun", serif;
      font-size: clamp(19px, 2.6vw, 26px);
      line-height: 1.9;
      color: rgba(214, 140, 149, 0.92);
      text-align: center;
      letter-spacing: 0.04em;
      white-space: pre-line;
    }

    .image-overlay,
    .cut-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 260ms ease;
    }

    .image-overlay.active,
    .cut-overlay.active {
      opacity: 1;
    }

    .image-overlay {
      display: grid;
      place-items: center;
      padding: 30px;
      background: rgba(10, 12, 16, 0.76);
      backdrop-filter: blur(4px);
    }

    .image-overlay img {
      display: block;
      max-width: min(880px, calc(100vw - 56px));
      max-height: calc(100vh - 64px);
      object-fit: contain;
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.42);
      border-radius: 4px;
      transform: scale(0.98);
      transition: transform 700ms ease;
    }

    .image-overlay.active img {
      transform: scale(1);
    }

    .cut-overlay {
      display: grid;
      place-items: center;
      background: rgba(2, 3, 5, 0.97);
    }

    .cut-lines {
      display: grid;
      gap: 12px;
      width: min(720px, calc(100vw - 56px));
    }

    .cut-line {
      opacity: 0;
      text-align: center;
      font-family: "STSong", "SimSun", serif;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.5;
      color: rgba(230, 234, 240, 0.92);
      letter-spacing: 0.03em;
      transition: opacity 220ms ease;
    }

    .cut-line.show {
      opacity: 1;
    }

    .cut-line.red {
      color: rgba(180, 30, 40, 0.94);
      font-size: clamp(32px, 6vw, 56px);
      letter-spacing: 0.04em;
    }

    .cut-line.red.show {
      animation: redTextTremor 150ms steps(2, end) infinite;
    }

    @keyframes redTextTremor {
      0% { transform: translate(0, 0); filter: blur(0); }
      25% { transform: translate(-1px, 1px); filter: blur(0.2px); }
      50% { transform: translate(2px, -1px); filter: blur(0); }
      75% { transform: translate(-2px, 0); filter: blur(0.4px); }
      100% { transform: translate(1px, 0); filter: blur(0); }
    }

    .bg-text-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-text-overlay span {
      position: absolute;
      display: block;
      white-space: nowrap;
      color: rgba(150, 22, 36, 0.9);
      font-family: "STSong", "SimSun", serif;
      opacity: 0;
      text-shadow: 0 0 14px rgba(150, 22, 36, 0.14);
      transition: opacity 1800ms ease, transform 4800ms ease;
      user-select: none;
      animation: bgRedJitter 1400ms steps(2, end) infinite;
    }

    .bg-text-overlay.final span {
      color: rgba(188, 20, 35, 0.92);
      text-shadow: 0 0 18px rgba(188, 20, 35, 0.22);
      transition: opacity 3600ms ease, transform 9000ms ease;
    }

    @keyframes bgRedJitter {
      0%, 100% { margin-left: 0; margin-top: 0; filter: blur(0); }
      25% { margin-left: 1px; margin-top: -1px; filter: blur(0.15px); }
      50% { margin-left: -1px; margin-top: 1px; filter: blur(0); }
      75% { margin-left: 2px; margin-top: 0; filter: blur(0.25px); }
    }

    .ending {
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .ending-shell {
      position: relative;
      width: min(620px, 100%);
      height: clamp(520px, 72vh, 650px);
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 10px 0 30px;
      min-height: 520px;
      overflow: hidden;
    }

    .ending-shell.reading {
      align-content: center;
    }

    .ending-shell.reading .ending-media {
      display: none;
    }

    .ending-media {
      position: relative;
      z-index: 1;
      width: min(540px, 100%);
      aspect-ratio: 4 / 3;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(98, 113, 128, 0.14);
      box-shadow: 0 18px 48px rgba(37, 51, 66, 0.14);
      transition: opacity 1200ms ease, filter 1200ms ease, transform 1200ms ease;
    }

    .ending-media.waiting {
      opacity: 0;
      filter: brightness(0.4);
    }

    .ending-media.hidden {
      opacity: 0.18;
      filter: blur(6px) brightness(0.5);
      transform: scale(1.01);
    }

    .ending-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 160ms steps(2, end), filter 120ms steps(2, end), transform 120ms steps(2, end);
    }

    .ending-media img.secondary {
      opacity: 0;
    }

    .ending-media.swap img.primary {
      opacity: 0;
      filter: blur(1px) contrast(1.2);
      transform: scale(1.02);
    }

    .ending-media.swap img.secondary {
      opacity: 1;
    }

    .ending-lines {
      display: grid;
      position: relative;
      z-index: 2;
      gap: 9px;
      justify-items: stretch;
      width: min(520px, 100%);
      max-height: min(62vh, 610px);
      overflow-y: auto;
      padding: 2px 12px;
      text-align: left;
      transition: opacity 700ms ease, max-height 700ms ease, padding 700ms ease;
      scrollbar-width: none;
    }

    .ending-lines::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .ending-lines.hidden {
      opacity: 0;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ending-actions {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 900ms ease, transform 900ms ease, max-height 900ms ease;
    }

    .ending-actions.visible {
      max-height: 72px;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .ending-action {
      min-width: 120px;
      border: 1px solid rgba(214, 140, 149, 0.24);
      border-radius: 999px;
      padding: 11px 18px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(237, 241, 247, 0.92);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition), filter var(--transition);
    }

    .ending-action:hover {
      background: rgba(141, 50, 60, 0.16);
      border-color: rgba(214, 140, 149, 0.38);
    }

    .ending-action.missing.turned {
      cursor: not-allowed;
      color: rgba(237, 241, 247, 0.32);
      border-color: rgba(237, 241, 247, 0.12);
      background: rgba(255, 255, 255, 0.025);
      filter: grayscale(1);
    }

    .ending-line {
      opacity: 0;
      font-family: "STSong", "SimSun", serif;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 2.12;
      color: rgba(29, 37, 48, 0.82);
      transition: opacity 800ms ease;
      white-space: pre-line;
      margin: 0;
      max-width: 480px;
    }

    .ending-line.show {
      opacity: 1;
    }

    .afterimage {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1200ms ease;
      z-index: 0;
    }

    .afterimage.visible {
      opacity: 1;
    }

    .afterimage::before,
    .afterimage::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .afterimage.route-platform::before {
      background:
        linear-gradient(180deg, rgba(18, 21, 27, 0.1), rgba(7, 8, 11, 0.66));
    }

    .afterimage.route-platform::after {
      inset: 50% 14% auto 14%;
      height: 1px;
      background: rgba(192, 201, 210, 0.16);
      box-shadow: 0 40px 120px rgba(128, 138, 148, 0.08);
    }

    .afterimage.route-hydrangea::before {
      background:
        radial-gradient(circle at 50% 42%, rgba(64, 92, 124, 0.15), transparent 30%),
        linear-gradient(180deg, rgba(12, 14, 18, 0.1), rgba(7, 8, 11, 0.62));
    }

    .afterimage.route-hydrangea::after {
      background:
        repeating-linear-gradient(
          180deg,
          rgba(113, 139, 167, 0.03) 0,
          rgba(113, 139, 167, 0.03) 1px,
          transparent 1px,
          transparent 3px
        );
      opacity: 0.8;
    }

    .afterimage.route-erasure::before {
      background:
        radial-gradient(circle at 50% 40%, rgba(104, 67, 76, 0.18), transparent 26%),
        linear-gradient(180deg, rgba(12, 10, 13, 0.12), rgba(5, 5, 8, 0.7));
    }

    .afterimage.route-erasure::after {
      background:

    function analyzeText(text) {
      const compact = text.replace(/\s+/g, '');
      const result = {

        apologized: false,
        love: false,
        blamed: false,
        response: '你又在含糊其辞。\n没关系，我等。'
      };

      if (compact.includes('对不起') || compact.includes('抱歉')) {
        result.apologized = true;
      }
      if (compact.includes('爱')) {
        result.love = true;
      }
      if (compact.includes('我知道') || compact.includes('我错') || compact.includes('不该') || compact.includes('我杀') || compact.includes('是我')) {
        result.accepted = true;
      }
      if (compact.includes('你也') || compact.includes('如果你') || compact.includes('你逼') || compact.includes('你先')) {
        result.blamed = true;
      }

      if (result.blamed) {
        result.response = '又在推卸责任。\n我早知道你会这样。';
      } else if (result.accepted) {
        result.response = '你说到自己了。\n这是我第一次听见你这样。';
      } else if (result.love) {
        result.response = '我知道你爱我。\n我也是。\n但这不是答案。';
      } else if (result.apologized) {
        result.response = '我听见了。\n我等了很久。';
      } else if (compact.includes('怕')) {
        result.response = '你怕的是空下来。';
      }

      return result;
    }

      if (compact.includes('西兰花')) {

        return {

        };

      if (compact.includes('对不起') || compact.includes('抱歉')) {
        state.flags.apologized = true;
        state.scores.remorse += 1;
      }
      if (compact.includes('我知道') || compact.includes('不该') || compact.includes('我错') || compact.includes('是我')) {
        state.flags.accepted = true;
        state.scores.remorse += 2;
      }
      if (compact.includes('爱')) {
        state.flags.saidLove = true;
        state.scores.attachment += 1;

      if (compact.includes('月台') || compact.includes('车站') || compact.includes('站台') || compact.includes('那天')) {

        stationMentioned = true;
      }
      if (compact.includes('花') || compact.includes('蓝') || compact.includes('雨')) {

      if (compact.includes('照片') || compact.includes('合照')) {

      if (compact.includes('那一声') || compact.includes('声音')) {

      if (compact.includes('你也') || compact.includes('如果你') || compact.includes('是你')) {
        state.flags.blamedHer = true;
        state.scores.denial += 1;
      }
      if (compact.includes('不知道') || compact.includes('说不清')) {
        unsureMentioned = true;
      }
      if (compact.includes('我害怕') || compact.includes('怕')) {
        fearMentioned = true;
        state.scores.remorse += 1;
      }

      if (unsureMentioned && !state.flags.accepted) {
        inputHint.textContent = '再往前一点。';
        return {
          advance: false,
          reply: '你知道的。\n你只是说不清楚。'
        };
      }

      if (fearMentioned && !state.flags.accepted) {
        inputHint.textContent = '不是只有你害怕。';
        return {
          advance: false,
          reply: '你怕什么。\n她比你更怕。'
        };
      }

      if (stationMentioned && !state.flags.accepted && !state.flags.apologized && !state.flags.blamedHer && !state.flags.saidLove) {
        inputHint.textContent = '继续。';
        return {
          advance: false,
          reply: '那天。\n你记得那天。'
        };
      }

      if (state.flags.blamedHer && !state.flags.accepted) {
        return {
          advance: true,
          reply: '你还是这样。我以为你会说点别的。'
        };
      }

      if (state.flags.accepted && state.flags.apologized) {
        return {
          advance: true,
          reply: '我听见了。\n谢谢你说出来。'
        };
      }

      if (state.flags.accepted) {
        return {
          advance: true,
          reply: '你说到自己了。\n继续。'
        };
      }

      if (state.flags.saidLove && state.gateAttempts === 1) {
        inputHint.textContent = '不是这一句。';
        return {
          advance: false,
          reply: '我知道你爱我。\n但那不够。'
        };
      }

      if (state.gateAttempts >= 2) {
        inputHint.textContent = '';
        return {
          advance: true,
          reply: '算了。\n我说不下去了。\n不是原谅。'
        };
      }

      inputHint.textContent = '说清楚一点。';
      return {
        advance: false,
        reply: '你在狡辩。\n说你自己。'
      };
    }

    function renderStep() {
      clearTimers();
      resetShake();
      resetPageShake();
      imageOverlay.classList.remove('active');
      cutOverlay.classList.remove('active');
      document.querySelectorAll('.step17-reply').forEach((item) => item.remove());
      questionTitle.style.opacity = '';
      questionTitle.style.transition = '';
      questionCopy.style.opacity = '';
      questionCopy.style.transition = '';
      questionCopy.style.fontSize = '';
      questionCopy.style.letterSpacing = '';
      textBlock.style.opacity = '';
      textBlock.style.transition = '';
      progressFill.style.background = '';
      progressFill.classList.remove('pulse');
      if (step17PulseHandler) {
        textInput.removeEventListener('keydown', step17PulseHandler);
        step17PulseHandler = null;
      }

      const step = currentStep();
      setPhase(step.phase);
      setView(surveyView);

      const meta = getMeta(step);
      metaCode.textContent = meta.code;
      metaTitle.textContent = meta.title;
      metaSub.textContent = meta.sub;

      progressText.textContent = `${pad(step.id)} / 21`;
      progressMeta.textContent = step.progressMeta;
      progressFill.style.width = `${(step.id / 21) * 100}%`;
      helperLine.textContent = getHelper(step);

      questionNumber.textContent = pad(step.id);
      phaseLabel.textContent = step.label;
      questionTitle.textContent = step.title;
      questionCopy.textContent = getStepCopy(step) || '';
      if (step.id === 15 && state.flags.directA) {
        questionTitle.textContent = '我的话不难懂。';
        questionCopy.textContent = '我不是谜语。我已经说过不要再来了。你还是到了，你还...';
      } else if (step.id === 15 && state.flags.forcedA) {
        questionTitle.textContent = '我告诉过你停下。';
        questionCopy.textContent = '你不是已经选过了吗？。';
      }
      feedback.textContent = '';
      inputHint.textContent = step.hint || '';

      options.innerHTML = '';
      textBlock.classList.remove('active');
      dialogueLog.innerHTML = '';
      dialogueLog.classList.remove('active');
      textInput.value = '';
      textInput.disabled = false;
      submitButton.disabled = false;
      textInput.placeholder = step.placeholder || '';

      if (step.type === 'choice') {
        const optionList = getStepOptions(step);
        optionList.forEach((option) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'option';
          if (option.disabled) {
            button.classList.add('locked');
            button.disabled = true;
          }

          const dot = document.createElement('span');
          dot.className = 'option-dot';
          button.appendChild(dot);

          const body = document.createElement('span');
          body.className = 'option-body';
          const text = document.createElement('span');
          text.className = 'option-text';
          text.textContent = option.text;
          body.appendChild(text);
          button.appendChild(body);

          if (!option.disabled) {
            button.addEventListener('click', () => handleChoice(step, option, button));
            if (step.phase === 'breach' && option.rewrite) {
              button.addEventListener('mouseenter', () => {
                text.classList.add('replacing');
                schedule(() => {
                  text.textContent = option.rewrite;
                  text.classList.remove('replacing');
                }, 90);
              });
              button.addEventListener('mouseleave', () => {
                text.classList.add('replacing');
                schedule(() => {
                  text.textContent = option.text;
                  text.classList.remove('replacing');
                }, 90);
              });
            }
            if (step.phase === 'breach') {
              button.addEventListener('mouseenter', () => {
                if (Math.random() > 0.55) {
                  const siblings = Array.from(options.children).filter((item) => item !== button && !item.disabled);
                  siblings.forEach((item, index) => {
                    schedule(() => item.classList.add('faded'), 20 + index * 35);
                    schedule(() => item.classList.remove('faded'), 260 + index * 35);
                  });
                }
              });
            }
            if (step.forceA && option.value !== 'a') {
              button.addEventListener('mouseenter', () => {
                pulsePageShake('soft', 520);
              });
            }
          }

          options.appendChild(button);
        });
      } else {
        textBlock.classList.add('active');
        if (step.id === 20) {
          dialogueLog.classList.add('active');
          if (state.flags.accepted) {
            appendDialogue('other', '你说到自己了。');
            appendDialogue('other', '我在听。');
          } else if (state.flags.directA) {
            appendDialogue('other', '你第一次选了停下。');
            appendDialogue('other', '那就别再换答案。');
          } else if (state.flags.saidLove) {
            appendDialogue('other', '你又说爱。');
            appendDialogue('other', '爱不是理由。\n但我知道你是真的。');
          } else if (state.flags.blamedHer) {
            appendDialogue('other', '你还是这样。');
            appendDialogue('other', '我以为这次会不一样。');
          } else {
            appendDialogue('other', '我在。');
            appendDialogue('other', '说吧。');
          }
          startShake();
          schedule(() => textInput.focus(), 80);
        }
      }

      if (step.type === 'choice' && state.bgTextActive && step.id >= 15 && step.id <= 17) {
        addBgText(step.id === 17 ? 8 : 2);
      }

      if (step.id === 17) {
        if (state.bgTextActive) {
          addBgText(8);
        }
        questionTitle.style.opacity = '0';
        questionTitle.style.transition = 'opacity 1.2s ease';
        questionCopy.style.opacity = '0';
        questionCopy.style.transition = 'opacity 0.8s ease';
        textBlock.style.opacity = '0';
        textBlock.style.transition = 'opacity 0.6s ease';
        questionCopy.style.fontSize = '13px';
        questionCopy.style.letterSpacing = '0.1em';
        progressFill.style.background = 'linear-gradient(90deg, rgba(100, 20, 28, 0.98), rgba(155, 45, 58, 0.96))';
        step17PulseHandler = () => {
          progressFill.classList.add('pulse');
          window.setTimeout(() => progressFill.classList.remove('pulse'), 280);
        };
        textInput.addEventListener('keydown', step17PulseHandler);
        schedule(() => {
          questionTitle.style.opacity = '1';
        }, 500);
        schedule(() => {
          questionCopy.style.opacity = '1';
        }, 1400);
        schedule(() => {
          textBlock.style.opacity = '1';
          startShake();
          pulsePageShake('soft', 620);
          textInput.focus();
        }, 2100);
      }

      applyEarlyQuestionAnomaly(step);
    }

    function handleForceAChoice(step, option, button, buttons) {
      const optionList = getStepOptions(step);
      const canonical = optionList.find((item) => item.value === 'a') || option;
      buttons.forEach((item) => {
        item.disabled = true;
      });

      if (option.value === 'a') {
        button.classList.add('selected');
        applyScores(option);
        applyFlags(option);
        state.flags.directA = true;
        state.answers.push({ step: step.id, value: option.value });
        feedback.textContent = '这次你没有绕开。';
        schedule(nextStep, 1200);
        return;
      }

      state.flags.forcedA = true;
      applyScores(option);
      applyFlags(option);
      state.answers.push({ step: step.id, value: option.value, rewrittenTo: 'a' });
      pulsePageShake('hard', 760);
      feedback.textContent = '选项哪变了呢？是你终于看见了才对哦。';
      buttons.forEach((item, index) => {
        const text = item.querySelector('.option-text');
        schedule(() => {
          item.classList.add('selected');
          if (text) {
            text.classList.add('replacing');
          }
        }, index * 80);
        schedule(() => {
          if (text) {
            text.textContent = canonical.text;
            text.classList.remove('replacing');
          }
        }, 140 + index * 80);
      });
      schedule(nextStep, 1800);
    }

    function handleChoice(step, option, button) {
      const buttons = Array.from(options.querySelectorAll('.option'));
      if (step.forceA) {
        handleForceAChoice(step, option, button, buttons);
        return;
      }

      buttons.forEach((item) => {
        item.disabled = true;
      });
      button.classList.add('selected');

      applyScores(option);
      applyFlags(option);
      applyStepSpecificChoiceEffects(step, option);
      state.answers.push({ step: step.id, value: option.value });
      feedback.textContent = choiceFeedback(step, option);

      if (state.bgTextActive && step.id >= 15 && step.id <= 16) {
        addBgText(2);
      }

      if (step.id === 9 && option.value === 'otherfault') {
        const delay = playCutScene(['你先想到的是她。'], { redText: true, gap: 900, hold: 1900 });
        schedule(nextStep, delay + 120);
        return;
      }

      if (step.id === 13 && option.value === 'tryagain') {
        const delay = playCutScene(['没有了。'], { redText: true, gap: 900, hold: 1900 });
        schedule(nextStep, delay + 120);
        return;
      }

      if (step.id === 14 && option.value !== 'stop') {
        const platformCutLines = [
          '那天月台上真的好冷啊。',
          '我已经跟你说过好几次，不要再来了。',
          '你还是站到了我后面。',
          '可我没想到，最后一次听见你靠近我，是车进站的时候。'
        ];
        const playPlatformCut = () => {
          const delay = playCutScene(platformCutLines, { killAudio: true, gap: 1200, hold: 1900 });
          schedule(nextStep, delay + 120);
        };
        if (option.value === 'confirm' || option.value === 'explain') {
          const redDelay = playCutScene(['她是认真的。'], { redText: true, gap: 900, hold: 1800 });
          schedule(playPlatformCut, redDelay + 140);
          return;
        }
        const delay = playCutScene(platformCutLines, { killAudio: true, gap: 1200, hold: 1900 });
        schedule(nextStep, delay + 120);
        return;
      }

      if (step.id === 15 && option.value === 'more') {
        const delay = playCutScene(['我知道。'], { redText: true, gap: 900, hold: 1800 });
        schedule(nextStep, delay + 120);
        return;
      }

      if (step.id === 18) {
        const delay = playCutScene(['我听见你说的了。'], { gap: 900, hold: 1100 });
        schedule(nextStep, delay + 100);
        return;
      }

      if (step.id === 21) {
        schedule(() => startEnding(resolveEnding()), 1200);
        return;
      }

      schedule(nextStep, step.phase === 'breach' ? 1200 : 900);
    }

    function handleTextSubmit() {
      const step = currentStep();
      const text = textInput.value.trim();
      if (!text) {
        inputHint.textContent = '这里不能留空。';
        return;
      }

      if (step.id === 17) {
        const reply = handleStep17Text(text);
        textInput.disabled = true;
        submitButton.disabled = true;
        state.answers.push({ step: step.id, value: text });

        textBlock.style.transition = 'opacity 0.5s ease';
        textBlock.style.opacity = '0';

        const replyEl = document.createElement('p');
        replyEl.className = 'step17-reply';
        replyEl.textContent = reply;
        replyEl.style.opacity = '0';
        replyEl.style.transition = 'opacity 1.1s ease';
        feedback.parentNode.insertBefore(replyEl, feedback);

        schedule(() => {
          replyEl.style.opacity = '1';
        }, 600);

        schedule(() => {
          const delay = playCutScene(['那天我就在你面前啊。', '我当时也不明白。', '我现在也还是不明白。'], { gap: 1200, hold: 1800 });
          schedule(nextStep, delay + 200);
        }, 4000);
        return;
      }

      if (step.id === 20) {
        appendDialogue('self', text);
        textInput.value = '';
        const result = handleGateText(text);
        schedule(() => appendDialogue('other', result.reply), 180);
        if (result.route) {
          textInput.disabled = true;
          submitButton.disabled = true;
          schedule(() => startEnding(result.route), 1700);
          return;
        }
        if (result.advance) {
          textInput.disabled = true;
          submitButton.disabled = true;
          schedule(nextStep, 1300);
        } else {
          schedule(() => textInput.focus(), 260);
        }
      }
    }

    function nextStep() {
      state.index += 1;
      if (state.index >= steps.length) {
        startEnding(resolveEnding());
        return;
      }
      renderStep();
    }

    function startSurvey() {
      state.index = 0;
      setView(surveyView);
      renderStep();
      playAudio();
    }

    function resolveEnding() {
      const accepted = state.flags.accepted || state.flags.apologized;
      const symbol = state.flags.symbolChoice;
      const denialHeavy = state.scores.denial >= 2 || state.flags.blamedHer;
      const pursuitHeavy = state.scores.pursuit >= 4;
      const tenderEnough = state.scores.tenderness + state.scores.remorse >= 4;

      if (state.flags.truth) {
        return 'truth';
      }
      if (denialHeavy || (state.finalChoice === 'return' && !accepted) || (pursuitHeavy && !accepted)) {
        return 'erasure';
      }
      if (state.flags.saidLove && !accepted) {
        return 'loop';
      }
      if (tenderEnough && symbol === 'flower' && (state.finalChoice === 'outside' || state.finalChoice === 'leave')) {
        return 'hydrangea';
      }
      if ((symbol === 'photo' || state.finalChoice === 'takephoto') && !accepted) {
        return 'loop';
      }
      if (accepted && (symbol === 'station' || state.finalChoice === 'leave' || state.finalChoice === 'outside')) {
        return 'platform';
      }
      if (tenderEnough && (symbol === 'flower' || symbol === 'station' || state.finalChoice === 'outside')) {
        return 'hydrangea';
      }
      return accepted ? 'platform' : 'erasure';
    }

    function addEndingLine(text, delay) {
      const line = document.createElement('p');
      line.className = 'ending-line';
      line.textContent = text;
      endingLines.appendChild(line);
      schedule(() => {
        line.classList.add('show');
        endingLines.scrollTop = endingLines.scrollHeight;
      }, delay);
      return line;
    }

    function startEnding(route) {
      clearTimers();
      resetShake();
      resetPageShake();
      clearBgText();
      state.currentRoute = route;
      state.photoRevealed = false;
      setPhase('final');
      setView(endingView);
      startFinalBgText(route);

      const config = getEndingConfig(route);

      metaCode.textContent = 'MHC-17 / closed';
      metaTitle.textContent = '—';
      metaSub.textContent = '';

      endingShell.classList.add('reading');
      endingMedia.classList.remove('hidden', 'swap');
      endingMedia.classList.add('waiting');
      endingLines.classList.remove('hidden');
      endingLines.innerHTML = '';
      endingActions.classList.remove('visible');
      endingActions.setAttribute('aria-hidden', 'true');
      endingMissingButton.textContent = '我很想你';
      endingMissingButton.classList.remove('turned');
      afterimage.className = `afterimage route-${route}`;
      restartButton.classList.remove('visible');

      endingPrimary.style.opacity = '';
      endingPrimary.style.filter = '';
      endingPrimary.style.transform = '';
      endingPrimary.style.transition = '';
      endingSecondary.style.opacity = '';
      endingSecondary.style.filter = '';
      endingSecondary.style.transform = '';
      endingSecondary.style.transition = '';

      endingPrimary.src = config.primary;
      endingSecondary.src = config.secondary || config.primary;

      if (!config.secondary) {
        endingSecondary.style.opacity = '0';
      }

      schedule(() => {
        metaCode.textContent = '她还在这里。';
        schedule(() => {
          metaCode.textContent = 'MHC-17 / closed';
        }, 2000);
      }, 3000);

      const firstLineAt = 2000;
      const lineGap = 3600;
      const lines = config.lines;
      lines.forEach((line, index) => {
        addEndingLine(line, firstLineAt + index * lineGap);
      });

      const lastLineAt = firstLineAt + Math.max(lines.length - 1, 0) * lineGap;
      schedule(() => {
        endingActions.classList.add('visible');
        endingActions.setAttribute('aria-hidden', 'false');
        pulsePageShake('soft', 620);
      }, lastLineAt + 3600);
    }

    function revealEndingImage(route) {
      if (state.photoRevealed || !route) {
        return;
      }

      state.photoRevealed = true;
      endingActions.classList.remove('visible');
      endingActions.setAttribute('aria-hidden', 'true');
      endingLines.classList.add('hidden');
      pulsePageShake('soft', 620);

      schedule(() => {
        endingShell.classList.remove('reading');
        endingMedia.classList.remove('waiting');
      }, 650);

      if (route === 'erasure') {
        schedule(runErasureSwap, 3500);
      }

      if (route === 'loop') {
        schedule(() => {
          endingPrimary.style.transition = 'transform 30s linear, filter 20s ease';
          endingPrimary.style.transform = 'scale(1.18)';
          endingPrimary.style.filter = 'blur(2.5px)';
        }, 1450);
      }

      schedule(() => {
        afterimage.classList.add('visible');
      }, 3600);

      schedule(() => {
        restartButton.classList.add('visible');
      }, 7200);
    }

    function resetState() {
      clearTimers();
      resetShake();
      resetPageShake();
      clearBgText();
      imageOverlay.classList.remove('active');
      cutOverlay.classList.remove('active');
      state.index = -1;
      state.scores = {
        attachment: 0,
        pursuit: 0,
        withdrawal: 0,
        tenderness: 0,
        loss: 0,
        denial: 0,
        remorse: 0
      };
      state.flags = {
        resistedStop: false,
        wentAgain: false,
        accepted: false,
        apologized: false,
        saidLove: false,
        blamedHer: false,
        truth: false,
        directA: false,
        forcedA: false,
        symbolChoice: '',
        audioDead: false
      };
      state.answers = [];
      state.gateAttempts = 0;
      state.bgTextActive = false;
      state.bgTextLevel = 0;
      state.shownImages = new Set();
      state.finalChoice = '';
      state.currentRoute = '';
      state.photoRevealed = false;
      bgm.pause();
      bgm.currentTime = 0;
      endingShell.classList.remove('reading');
      endingMedia.classList.remove('hidden', 'swap', 'waiting');
      endingLines.classList.remove('hidden');
      endingActions.classList.remove('visible');
      endingActions.setAttribute('aria-hidden', 'true');
      endingMissingButton.textContent = '我很想你';
      endingMissingButton.classList.remove('turned');
      afterimage.className = 'afterimage';
      endingPrimary.style.opacity = '';
      endingPrimary.style.filter = '';
      endingPrimary.style.transform = '';
      endingPrimary.style.transition = '';
      endingSecondary.style.opacity = '';
      endingSecondary.style.filter = '';
      endingSecondary.style.transform = '';
      endingSecondary.style.transition = '';
      updateAudioButton();
      setPhase('paper');
      metaCode.textContent = 'MHC-17 / outpatient';
      metaTitle.textContent = '社会联结与应激回访表';
      metaSub.textContent = '匿名填写。部分题目会根据前文自动调整措辞。';
      setView(introView);
    }

    startButton.addEventListener('click', startSurvey);
    restartButton.addEventListener('click', resetState);
    endingApologyButton.addEventListener('click', () => revealEndingImage(state.currentRoute));
    endingMissingButton.addEventListener('mouseenter', () => {
      endingMissingButton.textContent = '对不起';
      endingMissingButton.classList.add('turned');
      pulsePageShake('soft', 460);
    });
    endingMissingButton.addEventListener('mouseleave', () => {
      endingMissingButton.textContent = '我很想你';
      endingMissingButton.classList.remove('turned');
    });
    endingMissingButton.addEventListener('click', (event) => {
      event.preventDefault();
      pulsePageShake('soft', 460);
    });
    submitButton.addEventListener('click', handleTextSubmit);
    textInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleTextSubmit();
      }
    });

    audioToggle.addEventListener('click', async () => {
      if (state.flags.audioDead) {
        return;
      }
      if (bgm.paused) {
        await playAudio();
      } else {
        bgm.pause();
        updateAudioButton();
      }
    });

    updateAudioButton();
    console.info('%c这个页面是做给西兰花的。', 'color:#8d323c;font-size:13px;letter-spacing:0.08em;');
  </script>
</body>
</html>
